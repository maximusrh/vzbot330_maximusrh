[gcode_macro G29]
gcode:
    M140 S110
    M190 S110
    G28
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE profile=mesh
    #BED_MESH_PROFILE SAVE=mesh 
    SAVE_CONFIG

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
	SET_GCODE_OFFSET Z=0             ; clear per-filament Z offset

    {% set rapid = printer["gcode_macro _RAPID_CAL_STATE"].enabled %}
    {% set filament = printer["gcode_macro _RAPID_CAL_STATE"].filament %}

    # keep in sync with KlipperScreen.conf [preheat X] sections
    {% set standby_temps = {
        "PLA":   200,
        "ABS":   240,
        "PETG":  230,
        "FLEX":  220,
        "TPU":   220
    } %}
    {% set standby_bed = {
        "PLA":   60,
        "ABS":   100,
        "PETG":  80,
        "FLEX":  50,
        "TPU":   50
    } %}

    {% if not rapid %}
        TURN_OFF_HEATERS
    {% else %}
        {% set hotend_standby = standby_temps.get(filament, 150) %}
        {% set bed_standby = standby_bed.get(filament, 50) %}
        M104 S{hotend_standby}
        M140 S{bed_standby}
        RESPOND MSG="Rapid cal: cancel - holding {filament} at {hotend_standby}C / bed {bed_standby}C"
    {% endif %}

	M107	;turn off print cooling fan
	RSCS_off	;turn off RSCS fans
	exhaustfan_off	;turn off exhaust fan
	

    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro Z_OFFSET]
description: Apply a Z offset based on filament type. Usage: Z_OFFSET FILAMENT=PETG
gcode:
    {% set filament = params.FILAMENT|default("PLA")|string|upper %}

    # Per-filament Z offsets (placeholders, tune each one)
    {% set z_offsets = {"PLA": 0, "PETG": 0, "ABS": 0, "TPU": 0} %}
    {% set z_offset = z_offsets[filament] if filament in z_offsets else 0.0 %}

    SET_GCODE_OFFSET Z={z_offset}
    RESPOND MSG="{filament}: Z offset {z_offset}"

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state
# Convert Marlin linear advance (M900) commands to Klipper (SET_PRESSURE_ADVANCE) commands.
# For use with Marlin's linear advance calibration: https://marlinfw.org/tools/lin_advance/k-factor.html

[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set p = params.P|default(0)|int %}
    {% set s = params.S|default(255)|float %}
    
	{% if p == 2 %}								
        SET_FAN_SPEED FAN=RSCS SPEED={s / 255}	;call RSCS fans from M106 P2
    
	{% elif p == 3 %}
        SET_FAN_SPEED FAN=Exhaust_fan SPEED={s / 255}	;call Exhaust fan from M106 P3
    
	{% else %}
        M106.1 {rawparams}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% set p = params.P|default(0)|int %}
    {% if p == 1 %}
        SET_FAN_SPEED FAN=RSCS SPEED=0
    {% else %}
        M107.1 {rawparams}
    {% endif %}

[gcode_macro M900]
gcode:
	# Parameters
	{% set pa = params.K|float %}
	SET_PRESSURE_ADVANCE ADVANCE={pa}

[gcode_macro _RAPID_CAL_STATE]
variable_enabled: 0
variable_filament: "PLA"
gcode:
    # state holder only - never called directly

[gcode_macro RAPID_CAL_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=_RAPID_CAL_STATE VARIABLE=enabled VALUE=1
    RESPOND MSG="Rapid calibration mode: ON (hotend/bed will stay hot after PRINT_END)"

[gcode_macro RAPID_CAL_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=_RAPID_CAL_STATE VARIABLE=enabled VALUE=0
    RESPOND MSG="Rapid calibration mode: OFF (normal cooldown on PRINT_END)"

[gcode_macro RAPID_CAL_TOGGLE]
gcode:
    {% if printer["gcode_macro _RAPID_CAL_STATE"].enabled %}
        RAPID_CAL_OFF
    {% else %}
        RAPID_CAL_ON
    {% endif %}

[gcode_macro Disable_Steppers]
gcode:
    M84

[gcode_macro RETRACTION_UP]
gcode:
    {% set CRLEN = printer.firmware_retraction.retract_length|float %}
    {% set NRLEN = CRLEN|float + 0.1 %}
    { action_respond_info("current retract_length %.2f, new retract_length %.2f" % (CRLEN, NRLEN))  }
    SET_RETRACTION RETRACT_LENGTH={NRLEN}    

[gcode_macro RETRACTION_DOWN]
gcode:
    {% set CRLEN = printer.firmware_retraction.retract_length|float %}
    {% set NRLEN = CRLEN|float - 0.1 %}
    { action_respond_info("current retract_length %.2f, new retract_length %.2f" % (CRLEN, NRLEN))  }
    SET_RETRACTION RETRACT_LENGTH={NRLEN}   


[gcode_macro SET_RETRACTIONLENGTH]
gcode:
  SET_RETRACTION RETRACT_LENGTH={params.LENGTH|float}
  GET_RETRACTION


