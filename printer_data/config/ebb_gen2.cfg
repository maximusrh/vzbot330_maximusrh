# https://github.com/bigtreetech/EBB/blob/master/EBB_GEN2/EBB36_GEN2/sample-bigtreetech-ebb36-gen2-v1.0.cfg

# This file contains common pin mappings for the BIGTREETECH EBB36
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)" .
# The "EBB36 GEN2" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBB]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_320019001750304158373620-if00
#canbus_uuid=a62a88bb28e3

[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: EBB:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder]
step_pin: EBB:PB14
dir_pin: !EBB:PA8
enable_pin: !EBB:PB6
microsteps: 16
#Alu VZhextrudort Moons 10T
rotation_distance: 28.9 ;tested to be best value in open air caibration
#rotation_distance: 28.6 ;old value which was calibrated with hotend attached, with included nozzle from Mellow
gear_ratio: 50:10
nozzle_diameter: 0.4
filament_diameter: 1.750

heater_pin: EBB:PB4
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: EBB:PA3

control: pid
pid_Kp: 28.737
pid_Ki: 1.935
pid_Kd: 106.684

min_temp: 0
max_temp: 400000000

full_steps_per_rotation: 200
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 500
max_extrude_only_velocity: 200
max_extrude_only_accel: 10000
min_extrude_temp: 0
pressure_advance: 0.02
pressure_advance_smooth_time: 0.03

[tmc2209 extruder]
uart_pin: EBB:PB3
interpolate: false
run_current: 0.7
sense_resistor: 0.110

