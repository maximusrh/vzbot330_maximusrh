#### 
# To make your print_start macro work you need to put a bit of code in your slicer too. Put this in the: Start G-code in SS at printer settings and then Custom G-code. Put in the code down below there.
#
#    PRINT_START EXTRUDER_TEMP={first_layer_temperature[initial_extruder] + extruder_temperature_offset[initial_extruder]} BED_TEMP=[first_layer_bed_temperature]
####
#    In your End G-code you simply put:
#    print_end    ;end script from macro
####

[gcode_macro PRINT_START]
gcode:
	{% set filament = params.FILAMENT_TYPE|default("PLA")|string|upper %}
    SET_GCODE_VARIABLE MACRO=_RAPID_CAL_STATE VARIABLE=filament VALUE='"{filament}"'

    {% set BED_TEMP = params.BED_TEMP|default(100)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
	M117 Homing...	;display message
    M140 S{BED_TEMP}	;start bed heating
    G28
	Z_OFFSET FILAMENT={filament}	;set calibrated z-offset based on filament type, temperature dependent!!!
    G1 Z5 F600	;move the platform down 5mm 
    M109 S{EXTRUDER_TEMP}	;set and wait for nozzle to reach temperature
	M190 S{BED_TEMP}	;wait for bed to reach temperature
    G1 X10 Y10 F6000
    G1 Z0.3 F600
    G92 E0	;zero the extruded length again
    G1 Y190 E10 F6000	;print intro line
    G1 X13 E11 F6000	;move x-axis for next line
    G1 Y10 E20 F6000	;print intro line #2
    G92 E0.0	;zero the extruded length again
    G1 F9000
    M117 Printing...

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script
gcode:
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe directions to move
    {% if printer.toolhead.position.x < (max_x - 15) %}
        {% set x_safe = 10.0 %}
    {% else %}
        {% set x_safe = -10.0 %}
    {% endif %}
    {% if printer.toolhead.position.y < (max_y - 15) %}
        {% set y_safe = 10.0 %}
    {% else %}
        {% set y_safe = -10.0 %}
    {% endif %}
    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 50.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    #  Commence PRINT_END
    M400                             ; wait for buffer to clear
	SET_GCODE_OFFSET Z=0             ; clear per-filament Z offset
    G92 E0                           ; zero the extruder
    G1 E-4.0 F3600                   ; retract
    G91                              ; relative positioning
    G0 Z{z_safe} F3600               ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000    ; move nozzle to remove stringing

    {% set rapid = printer["gcode_macro _RAPID_CAL_STATE"].enabled %}
    {% set filament = printer["gcode_macro _RAPID_CAL_STATE"].filament %}

    # keep in sync with KlipperScreen.conf [preheat X] sections
    {% set standby_temps = {
        "PLA":   200,
        "ABS":   240,
        "PETG":  230,
        "FLEX":  220,
        "TPU":   220
    } %}
    {% set standby_bed = {
        "PLA":   60,
        "ABS":   100,
        "PETG":  80,
        "FLEX":  50,
        "TPU":   50
    } %}

    {% if not rapid %}
        M104 S0                          ; turn off hotend
        M140 S0                          ; turn off bed
        M107                             ; turn off fan
    {% else %}
        {% set hotend_standby = standby_temps.get(filament, 150) %}
        {% set bed_standby = standby_bed.get(filament, 50) %}
        M104 S{hotend_standby}
        M140 S{bed_standby}
        RESPOND MSG="Rapid cal: holding {filament} at {hotend_standby}C / bed {bed_standby}C"
    {% endif %}

    G90                              ; absolute positioning
    G0 X{max_x / 2} Y{max_y - 5} F3600   ; park nozzle at rear
    M84
    M117 Finished!